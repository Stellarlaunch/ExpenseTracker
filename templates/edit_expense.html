{% extends "base.html" %}
{% block content %}
<h2>Edit expense</h2>
<form method="POST">
    <input type="number" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>
    <select name="category" required>
        {% for c in categories %}
            <option value="{{ c }}" {% if c == expense.category %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
    </select>
    <input type="text" name="description" value="{{ expense.description or '' }}" maxlength="200">
    <input type="date" name="date" value="{{ expense.date.isoformat() }}" required>
    <button type="submit">Save changes</button>
</form>
<p><a href="{{ url_for('dashboard') }}">Cancel</a></p>
{% endblock %}
