<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
        }
        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 18px 24px;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        main {
            max-width: 820px;
            margin: 28px auto;
            background: white;
            padding: 28px 32px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
        }
        h2 { margin-top: 0; }
        h3 { margin-top: 32px; color: #334155; }
        a { color: #4f46e5; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        input, select {
            display: block;
            width: 100%;
            padding: 11px 12px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f8fafc;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        button {
            display: block;
            width: 100%;
            padding: 11px 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
        form[action*="delete"] button {
            background: #ef4444;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        form[action*="delete"] button:hover { background: #dc2626; }
        .flash {
            background: #eef2ff;
            border-left: 4px solid #4f46e5;
            padding: 10px 14px;
            margin-bottom: 16px;
            border-radius: 6px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th {
            text-align: left;
            padding: 10px 8px;
            background: #f1f5f9;
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; }
        tr:hover td { background: #f8fafc; }
        @media (max-width: 600px) {
            main { margin: 12px; padding: 18px; }
        }
    </style>
</head>
<body>
    <header>💸 Expense Tracker</header>
    <main>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
